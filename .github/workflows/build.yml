# 主站点：https://www.shurenwang.com/（自定义域名，页面在根路径 /）
# DNS：CNAME www → jerrylee99.github.io；Pages → Custom domain = www.shurenwang.com。
# 根路径部署不要设置 BASE_PATH（next.config 未设置时为 ""）。不要在仓库里加 CNAME：
# Actions 发布会忽略 CNAME 文件，域名以 GitHub Pages 设置为准。
# 旧项目页 https://jerrylee99.github.io/shurenwang-website/ 是次要/遗留地址。
# 若还要在该子路径提供，需另一次带 BASE_PATH=/shurenwang-website 的构建，不要和根路径构建混用。
# 仓库 Settings → Pages → Source 需要选 GitHub Actions，工作流本身不能改这个设置。

name: build

on:
  # Manual runs from the Actions UI. Pages Source must be GitHub Actions.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 不设置 BASE_PATH：自定义域名在根路径提供，前缀会让 CSS/JS/图片 404。
      - run: npm run build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
